[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dgsi"
version = "0.1.0"
description = "Deterministic CPU ingestion and scene packaging for Dynamic Gaussian Scene Intelligence."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "python-multipart>=0.0.20,<1",
  "numpy>=2.0,<3",
  "Pillow>=11,<13",
  "imageio-ffmpeg>=0.6,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.12,<1"]

[project.scripts]
dgsi = "dgsi.cli:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501"]
